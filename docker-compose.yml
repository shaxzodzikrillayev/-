services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DUTYHUB_DATA: /app/data
      DUTYHUB_UPLOADS: /app/data/uploads
      # Сгенерируйте свой: openssl rand -base64 32
      DUTYHUB_SECRET: ${DUTYHUB_SECRET:?задайте DUTYHUB_SECRET в .env}
    volumes:
      # Именованный том здесь и есть то, ради чего приложение можно деплоить:
      # без него SQLite и фото стираются при каждом пересоздании контейнера.
      - dutyhub-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dutyhub-data:
